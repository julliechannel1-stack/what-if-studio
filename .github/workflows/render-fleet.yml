name: Render fleet

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - name: Split chunks into 20 groups
        id: split
        run: |
          echo "groups=$(python3 split-chunks.py 20)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups).group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system deps for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2
      - name: Install dependencies
        run: npm ci
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Render group
        env:
          EPISODE: ${{ github.event.inputs.episode || 'test' }}
        run: |
          echo '${{ toJson(matrix.group) }}' > group.json
          bash render-group.sh group.json
      - name: Upload chunk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunks-${{ strategy.job-index }}
          path: out/**/chunks/*.mp4
          retention-days: 1
      - name: Upload Gofile links
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-${{ strategy.job-index }}
          path: gofile-links.txt
          retention-days: 1
